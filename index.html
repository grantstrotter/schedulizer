<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedulizer</title>
<link rel="stylesheet" href="styles.css">
<style>
  .home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 40px 20px;
  }
  .home h1 { margin: 0; }
  .home-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
  }
  .home-card {
    display: block;
    width: 320px;
    text-align: left;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    transition: border-color .15s;
  }
  .home-card:hover {
    border-color: var(--accent);
  }
  .home-card .home-card-emoji { font-size: 2em; }
  .home-card h2 { margin: 12px 0 6px; font-size: 1.15em; }
  .home-card p { margin: 0; color: var(--text-muted); font-size: 0.92em; line-height: 1.5; }
</style>
</head>
<body>

<div class="home">
  <h1>Schedulizer</h1>
  <div class="home-cards">
    <a class="home-card" href="schedule.html">
      <div class="home-card-emoji">🗓️</div>
      <h2>Schedule Groups</h2>
      <p>Decide which nights your groups run, based on leaders' availability.</p>
    </a>
    <a class="home-card" href="distribute.html">
      <div class="home-card-emoji">🧩</div>
      <h2>Distribute Participants</h2>
      <p>Place participants into already-decided groups, based on their ranked sign-up preferences.</p>
    </a>
  </div>
</div>

</body>
</html>
